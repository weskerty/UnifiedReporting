name: report-sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: report-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            const os = require('os')
            const path = require('path')
            const crypto = require('crypto')
            const { DatabaseSync } = require('node:sqlite')

            const TAG = 'data'
            const ASSET_NAME = 'reportados.db'
            const TITLE = '[report] sync'
            const MIN_ACCOUNT_AGE_MS = 365 * 24 * 60 * 60 * 1000
            const DEFAULT_CATEGORIAS = ['🧸', '🧃', '⚡', '📩', '🎰']
            const { owner, repo } = context.repo

            async function getOrCreateRelease() {
              try {
                const { data } = await github.rest.repos.getReleaseByTag({ owner, repo, tag: TAG })
                return data
              } catch (e) {
                if (e.status !== 404) throw e
                const { data } = await github.rest.repos.createRelease({ owner, repo, tag_name: TAG, name: TAG, body: '' })
                return data
              }
            }

            function decode(body) {
              const m = String(body || '').match(/```report\s*([\s\S]*?)\s*```/)
              if (!m) throw new Error('sin bloque ```report')
              return JSON.parse(m[1])
            }

            const RX_LID = /^\d+@lid$/

            const release = await getOrCreateRelease()
            const existingAsset = release.assets.find((a) => a.name === ASSET_NAME)

            const tmpPath = path.join(os.tmpdir(), ASSET_NAME)
            if (existingAsset) {
              const resp = await github.rest.repos.getReleaseAsset({
                owner, repo, asset_id: existingAsset.id,
                headers: { accept: 'application/octet-stream' },
              })
              fs.writeFileSync(tmpPath, Buffer.from(resp.data))
            }

            const db = new DatabaseSync(tmpPath)
            db.exec(`
              CREATE TABLE IF NOT EXISTS categorias_meta (emoji TEXT PRIMARY KEY);
              CREATE TABLE IF NOT EXISTS reportes (lid TEXT PRIMARY KEY, numero TEXT, categorias TEXT, extra TEXT);
              CREATE TABLE IF NOT EXISTS limit_log (lid TEXT, login TEXT, PRIMARY KEY (lid, login));
            `)
            if (db.prepare('SELECT COUNT(*) AS c FROM categorias_meta').get().c === 0) {
              const ins = db.prepare('INSERT INTO categorias_meta (emoji) VALUES (?)')
              for (const e of DEFAULT_CATEGORIAS) ins.run(e)
            }
            const categorias = new Set(db.prepare('SELECT emoji FROM categorias_meta').all().map((r) => r.emoji))

            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 })
            const targets = issues.filter((i) => !i.pull_request && i.title === TITLE)

            let changed = false
            const results = []

            for (const issue of targets) {
              const login = issue.user.login

              // Si no se puede determinar la antiguedad de la cuenta (rate limit u otro error),
              // no se toca el issue - queda abierto y se reintenta en la proxima corrida.
              let ageMs
              try {
                const { data: u } = await github.rest.users.getByUsername({ username: login })
                ageMs = Date.now() - new Date(u.created_at).getTime()
              } catch (e) {
                continue
              }

              let msg
              if (ageMs < MIN_ACCOUNT_AGE_MS) {
                msg = 'rechazado, filtro anti bot'
              } else {
                try {
                  const payload = decode(issue.body)
                  if (!RX_LID.test(payload.lid || '')) throw new Error('lid invalido')
                  if (!categorias.has(payload.categoria)) throw new Error('categoria invalida')

                  const already = db.prepare('SELECT 1 FROM limit_log WHERE lid = ? AND login = ?').get(payload.lid, login)
                  if (already) {
                    msg = 'ya reportado'
                  } else {
                    db.prepare('INSERT INTO limit_log (lid, login) VALUES (?, ?)').run(payload.lid, login)

                    const row = db.prepare('SELECT numero, categorias, extra FROM reportes WHERE lid = ?').get(payload.lid)
                    const cats = row ? JSON.parse(row.categorias) : {}
                    cats[payload.categoria] = (cats[payload.categoria] || 0) + 1
                    const numero = (row && row.numero) || payload.numero || ''
                    const extra = row ? row.extra : '{}'
                    db.prepare(`
                      INSERT INTO reportes (lid, numero, categorias, extra) VALUES (?, ?, ?, ?)
                      ON CONFLICT(lid) DO UPDATE SET numero = excluded.numero, categorias = excluded.categorias
                    `).run(payload.lid, numero, JSON.stringify(cats), extra)

                    changed = true
                    msg = 'ok'
                  }
                } catch (e) {
                  msg = 'rechazado: ' + e.message
                }
              }
              results.push({ number: issue.number, msg })
            }

            db.close()

            if (changed) {
              const newBuf = fs.readFileSync(tmpPath)
              const hash = crypto.createHash('sha256').update(newBuf).digest('hex')

              if (existingAsset) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existingAsset.id })
              }
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name: ASSET_NAME, data: newBuf,
              })
              await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, body: `sha256:${hash}` })
            }

            for (const r of results) {
              await github.rest.issues.createComment({ owner, repo, issue_number: r.number, body: r.msg })
              await github.rest.issues.update({ owner, repo, issue_number: r.number, state: 'closed' })
            }
