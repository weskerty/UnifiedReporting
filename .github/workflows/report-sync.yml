name: report-sync

on:
  schedule:
    - cron: '0 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: report-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-slim
    steps:
      - uses: actions/github-script@v9
        with:
          script: |
            const fs = require('fs')
            const os = require('os')
            const path = require('path')
            const crypto = require('crypto')
            const { DatabaseSync } = require('node:sqlite')

            const TAG = 'data'
            const ASSET_NAME = 'reportados.db'
            const WEB_BRANCH = 'web-data'
            const WEB_FILE = 'reportados.json'
            const TITLE = '[report] sync'
            const MIN_ACCOUNT_AGE_MS = 365 * 24 * 60 * 60 * 1000
            const DEFAULT_CATEGORIAS = ['🧸', '🧃', '⚡', '📩', '🎰']
            const { owner, repo } = context.repo

            async function getOrCreateRelease() {
              try {
                const { data } = await github.rest.repos.getReleaseByTag({ owner, repo, tag: TAG })
                return data
              } catch (e) {
                if (e.status !== 404) throw e
                const { data } = await github.rest.repos.createRelease({ owner, repo, tag_name: TAG, name: TAG, body: '' })
                return data
              }
            }

            async function getCategoriasJson() {
              try {
                const { data } = await github.rest.repos.getContent({ owner, repo, path: 'categorias.json', ref: 'main' })
                return JSON.parse(Buffer.from(data.content, 'base64').toString('utf8'))
              } catch (e) {
                return DEFAULT_CATEGORIAS
              }
            }

            // La posicion en categorias.json es el id estable de cada categoria, el emoji
            // es solo su representacion actual. Si categorias.json cambia el emoji de una
            // posicion ya existente, se migra la clave en reportes.categorias conservando
            // el contador; si la posicion es nueva, se agrega sin migrar nada.
            function syncCategorias(db, lista) {
              let cambio = false
              for (let idx = 0; idx < lista.length; idx++) {
                const emoji = lista[idx]
                const row = db.prepare('SELECT emoji FROM categorias_meta WHERE idx = ?').get(idx)
                if (!row) {
                  db.prepare('INSERT INTO categorias_meta (idx, emoji) VALUES (?, ?)').run(idx, emoji)
                  cambio = true
                } else if (row.emoji !== emoji) {
                  for (const r of db.prepare('SELECT lid, categorias FROM reportes').all()) {
                    const cats = JSON.parse(r.categorias)
                    if (row.emoji in cats) {
                      cats[emoji] = (cats[emoji] || 0) + cats[row.emoji]
                      delete cats[row.emoji]
                      db.prepare('UPDATE reportes SET categorias = ? WHERE lid = ?').run(JSON.stringify(cats), r.lid)
                    }
                  }
                  db.prepare('UPDATE categorias_meta SET emoji = ? WHERE idx = ?').run(emoji, idx)
                  cambio = true
                }
              }
              return cambio
            }

            // Migracion unica del esquema viejo (emoji TEXT PRIMARY KEY, sin posicion) al nuevo.
            // Devuelve true si migro algo, para que el caller sepa que hay que resubir el asset.
            function migrarEsquemaCategorias(db) {
              const cols = db.prepare("PRAGMA table_info(categorias_meta)").all().map((c) => c.name)
              if (cols.includes('idx')) return false
              const existentes = db.prepare('SELECT emoji FROM categorias_meta ORDER BY rowid').all().map((r) => r.emoji)
              db.exec('DROP TABLE categorias_meta')
              db.exec('CREATE TABLE categorias_meta (idx INTEGER PRIMARY KEY, emoji TEXT)')
              const ins = db.prepare('INSERT INTO categorias_meta (idx, emoji) VALUES (?, ?)')
              existentes.forEach((emoji, idx) => ins.run(idx, emoji))
              return true
            }

            function decode(body) {
              const m = String(body || '').match(/```report\s*([\s\S]*?)\s*```/)
              if (!m) throw new Error('sin bloque ```report')
              return JSON.parse(m[1])
            }

            const RX_LID = /^\d+@lid$/

            // Branch de solo-data para la web: un commit huerfano (sin parent) por corrida,
            // force-updateado - no acumula historial a diferencia de un commit normal.
            async function pushOrphanJson(buf) {
              const { data: blob } = await github.rest.git.createBlob({ owner, repo, content: buf.toString('base64'), encoding: 'base64' })
              const { data: tree } = await github.rest.git.createTree({ owner, repo, tree: [{ path: WEB_FILE, mode: '100644', type: 'blob', sha: blob.sha }] })
              const { data: commit } = await github.rest.git.createCommit({ owner, repo, message: 'data', tree: tree.sha, parents: [] })
              try {
                await github.rest.git.updateRef({ owner, repo, ref: `heads/${WEB_BRANCH}`, sha: commit.sha, force: true })
              } catch (e) {
                if (e.status !== 404 && e.status !== 422) throw e
                await github.rest.git.createRef({ owner, repo, ref: `refs/heads/${WEB_BRANCH}`, sha: commit.sha })
              }
            }

            const release = await getOrCreateRelease()
            const existingAsset = release.assets.find((a) => a.name === ASSET_NAME)

            const tmpPath = path.join(os.tmpdir(), ASSET_NAME)
            if (existingAsset) {
              const resp = await github.rest.repos.getReleaseAsset({
                owner, repo, asset_id: existingAsset.id,
                headers: { accept: 'application/octet-stream' },
              })
              fs.writeFileSync(tmpPath, Buffer.from(resp.data))
            }

            const db = new DatabaseSync(tmpPath)
            db.exec(`
              CREATE TABLE IF NOT EXISTS categorias_meta (idx INTEGER PRIMARY KEY, emoji TEXT);
              CREATE TABLE IF NOT EXISTS reportes (lid TEXT PRIMARY KEY, numero TEXT, categorias TEXT, extra TEXT);
              CREATE TABLE IF NOT EXISTS limit_log (lid TEXT, login TEXT, PRIMARY KEY (lid, login));
            `)
            let changed = migrarEsquemaCategorias(db)
            changed = syncCategorias(db, await getCategoriasJson()) || changed
            const categorias = new Set(db.prepare('SELECT emoji FROM categorias_meta').all().map((r) => r.emoji))

            const { data: issues } = await github.rest.issues.listForRepo({ owner, repo, state: 'open', per_page: 100 })
            const targets = issues.filter((i) => !i.pull_request && i.title === TITLE)

            const results = []

            for (const issue of targets) {
              const login = issue.user.login

              // Si no se puede determinar la antiguedad de la cuenta (rate limit u otro error),
              // no se toca el issue - queda abierto y se reintenta en la proxima corrida.
              let ageMs
              try {
                const { data: u } = await github.rest.users.getByUsername({ username: login })
                ageMs = Date.now() - new Date(u.created_at).getTime()
              } catch (e) {
                continue
              }

              let msg
              if (ageMs < MIN_ACCOUNT_AGE_MS) {
                msg = 'rechazado, filtro anti bot'
              } else {
                try {
                  const payload = decode(issue.body)
                  if (!RX_LID.test(payload.lid || '')) throw new Error('lid invalido')
                  if (!categorias.has(payload.categoria)) throw new Error('categoria invalida')

                  const already = db.prepare('SELECT 1 FROM limit_log WHERE lid = ? AND login = ?').get(payload.lid, login)
                  if (already) {
                    msg = 'ya reportado'
                  } else {
                    db.prepare('INSERT INTO limit_log (lid, login) VALUES (?, ?)').run(payload.lid, login)

                    const row = db.prepare('SELECT numero, categorias, extra FROM reportes WHERE lid = ?').get(payload.lid)
                    const cats = row ? JSON.parse(row.categorias) : {}
                    cats[payload.categoria] = (cats[payload.categoria] || 0) + 1
                    const numero = (row && row.numero) || payload.numero || ''
                    // numero es sticky al primero no vacio - si llega uno distinto despues, se
                    // anota en extra.NewNumber (sin historial) en vez de pisar el numero original.
                    const extra = row ? JSON.parse(row.extra || '{}') : {}
                    if (row && row.numero && payload.numero && payload.numero !== row.numero) extra.NewNumber = payload.numero
                    db.prepare(`
                      INSERT INTO reportes (lid, numero, categorias, extra) VALUES (?, ?, ?, ?)
                      ON CONFLICT(lid) DO UPDATE SET numero = excluded.numero, categorias = excluded.categorias, extra = excluded.extra
                    `).run(payload.lid, numero, JSON.stringify(cats), JSON.stringify(extra))

                    changed = true
                    msg = 'ok'
                  }
                } catch (e) {
                  msg = 'rechazado: ' + e.message
                }
              }
              results.push({ number: issue.number, msg })
            }

            db.close()

            if (changed) {
              const newBuf = fs.readFileSync(tmpPath)
              const hash = crypto.createHash('sha256').update(newBuf).digest('hex')

              if (existingAsset) {
                await github.rest.repos.deleteReleaseAsset({ owner, repo, asset_id: existingAsset.id })
              }
              await github.rest.repos.uploadReleaseAsset({
                owner, repo, release_id: release.id, name: ASSET_NAME, data: newBuf,
              })
              await github.rest.repos.updateRelease({ owner, repo, release_id: release.id, body: `sha256:${hash}` })

              const dbForExport = new DatabaseSync(tmpPath, { readOnly: true })
              const exportRows = dbForExport.prepare('SELECT lid, numero, categorias FROM reportes').all()
                .map((r) => ({ lid: r.lid, numero: r.numero, categorias: JSON.parse(r.categorias || '{}') }))
              dbForExport.close()
              await pushOrphanJson(Buffer.from(JSON.stringify(exportRows)))
            }

            for (const r of results) {
              await github.rest.issues.createComment({ owner, repo, issue_number: r.number, body: r.msg })
              await github.rest.issues.update({ owner, repo, issue_number: r.number, state: 'closed' })
            }
